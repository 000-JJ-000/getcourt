# Local development: PostGIS + Rails web (db:prepare on start for convenience).
# Production: use docker-compose.prod.yml instead.
#
#   docker compose up -d db
#   docker compose up --build
#   docker compose --profile worker up -d   # optional dedicated Solid Queue

services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-getcourt}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-getcourt}
      POSTGRES_DB: ${DATABASE_NAME:-getcourt_development}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-getcourt}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-getcourt}
      DATABASE_NAME: ${DATABASE_NAME:-getcourt_development}
      DATABASE_CACHE_NAME: ${DATABASE_CACHE_NAME:-getcourt_development_cache}
      DATABASE_QUEUE_NAME: ${DATABASE_QUEUE_NAME:-getcourt_development_queue}
      DATABASE_CABLE_NAME: ${DATABASE_CABLE_NAME:-getcourt_development_cable}
      DATABASE_TEST_NAME: ${DATABASE_TEST_NAME:-getcourt_test}
      DATABASE_TEST_CACHE_NAME: ${DATABASE_TEST_CACHE_NAME:-getcourt_test_cache}
      DATABASE_TEST_QUEUE_NAME: ${DATABASE_TEST_QUEUE_NAME:-getcourt_test_queue}
      DATABASE_TEST_CABLE_NAME: ${DATABASE_TEST_CABLE_NAME:-getcourt_test_cable}
      APP_HOST: ${APP_HOST:-http://localhost:3000}
      # Dev convenience: jobs can run in Puma unless a dedicated worker profile is used.
      SOLID_QUEUE_IN_PUMA: ${SOLID_QUEUE_IN_PUMA:-}
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    # Development keeps one-shot prepare for convenience; production does not.
    command: >
      bash -c "bundle check || bundle install;
      bin/rails db:prepare;
      bin/docker-entrypoint web"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    profiles: ["worker"]
    build:
      context: .
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-getcourt}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-getcourt}
      DATABASE_NAME: ${DATABASE_NAME:-getcourt_development}
      DATABASE_CACHE_NAME: ${DATABASE_CACHE_NAME:-getcourt_development_cache}
      DATABASE_QUEUE_NAME: ${DATABASE_QUEUE_NAME:-getcourt_development_queue}
      DATABASE_CABLE_NAME: ${DATABASE_CABLE_NAME:-getcourt_development_cable}
      SOLID_QUEUE_IN_PUMA: ""
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    command: >
      bash -c "bundle check || bundle install;
      bin/docker-entrypoint worker"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'solid-queue|jobs start' >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  bundle_cache:
