<!doctype html>
<html lang="en">
<head>
  <title>Access denied (403) · GetCourt</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Статичная страница: Tailwind сюда не доезжает, поэтому палитра сайта
       (gray/slate, indigo → purple, лаймовый мяч) повторена руками. Работает и
       без JS: тёмная тема по системной, текст — английский. Скрипт внизу лишь
       берёт тему, выбранную на сайте, и язык поддомена (ru., es.). -->
  <style>
    :root { --bg: #f9fafb; --card: #fff; --border: #e5e7eb; --text: #111827; --muted: #6b7280; --code: #e0e7ff; --from: #4f46e5; --to: #a855f7; --btn: #4f46e5; --btn-hover: #4338ca; --ghost-hover: #f3f4f6; }
    @media (prefers-color-scheme: dark) {
      :root:not(.light) { --bg: #020617; --card: rgba(30, 41, 59, .8); --border: rgba(255, 255, 255, .1); --text: #f1f5f9; --muted: #94a3b8; --code: rgba(99, 102, 241, .15); --from: #818cf8; --to: #c084fc; --ghost-hover: rgba(255, 255, 255, .05); }
    }
    :root.dark { --bg: #020617; --card: rgba(30, 41, 59, .8); --border: rgba(255, 255, 255, .1); --text: #f1f5f9; --muted: #94a3b8; --code: rgba(99, 102, 241, .15); --from: #818cf8; --to: #c084fc; --ghost-hover: rgba(255, 255, 255, .05); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; padding: 2rem 1rem; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .gradient { background: linear-gradient(to right, var(--from), var(--to)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo { display: flex; flex-direction: column; line-height: 1.15; font-size: 1.25rem; font-weight: 700; text-decoration: none; }
    .logo span { display: inline-flex; align-items: baseline; gap: 2px; }
    .logo svg { width: 10px; height: 10px; }
    .card { width: 100%; max-width: 28rem; padding: 2rem 1.5rem; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 1rem; box-shadow: 0 1px 2px rgba(0, 0, 0, .05); }
    .code { display: inline-block; padding: .25rem .75rem; border-radius: 9999px; background: var(--code); font-size: .875rem; font-weight: 600; }
    .code b { font-weight: 600; }
    h1 { margin-top: 1rem; font-size: 1.5rem; font-weight: 700; }
    p { margin-top: .5rem; color: var(--muted); font-size: .95rem; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 1.5rem; }
    .btn { display: inline-flex; align-items: center; padding: .5rem 1.25rem; border-radius: 9999px; font-size: .875rem; font-weight: 500; text-decoration: none; cursor: pointer; font-family: inherit; transition: background-color .15s; }
    .btn-primary { background: var(--btn); color: #fff; border: 1px solid var(--btn); }
    .btn-primary:hover { background: var(--btn-hover); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--ghost-hover); }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <a class="logo" href="/" aria-label="GetCourt">
    <span class="gradient">Get</span>
    <span><span class="gradient">Court</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#d4f542"/><path d="M3 8 Q9 12 3 16" fill="none" stroke="white" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/><path d="M21 8 Q15 12 21 16" fill="none" stroke="white" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/></svg></span>
  </a>

  <main class="card">
    <span class="code"><b class="gradient">403</b></span>
    <h1 data-i18n="title">Access denied</h1>
    <p data-i18n="text">You don't have permission to open this page. Maybe you're signed in with a different account?</p>
    <div class="actions">
      <a class="btn btn-primary" href="/" data-i18n="home">Go to games</a>
      <button class="btn btn-ghost" type="button" data-back hidden data-i18n="back">Back</button>
    </div>
  </main>

  <script>
    (function () {
      var t = {
        ru: { title: "Нет доступа", text: "У вас нет прав на эту страницу. Возможно, вы вошли под другим аккаунтом?", home: "К играм", back: "Назад" },
        es: { title: "Acceso denegado", text: "No tienes permiso para abrir esta página. ¿Quizás has iniciado sesión con otra cuenta?", home: "Ir a los partidos", back: "Atrás" }
      };
      document.querySelectorAll("[data-back]").forEach(function (b) { if (history.length > 1) { b.hidden = false; b.onclick = function () { history.back(); }; } });
      try { var theme = localStorage.getItem("getcourt_theme"); if (theme) document.documentElement.classList.add(theme === "dark" ? "dark" : "light"); } catch (e) {}
      var lang = location.hostname.split(".")[0];
      if (!t[lang]) return;
      document.documentElement.lang = lang;
      document.title = t[lang].title + " (403) · GetCourt";
      document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[lang][el.getAttribute("data-i18n")]; });
    })();
  </script>
</body>
</html>
