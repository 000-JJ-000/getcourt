name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips42

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips42

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Аудит ходит в реестр npm по сети, и тот регулярно отвечает 503 или рвёт
      # соединение — проверка падала на PR, где JS никто не трогал. Уязвимость
      # так же уронит шаг, просто не с первой попытки.
      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: |
          for attempt in 1 2 3; do
            bin/importmap audit && exit 0
            echo "importmap audit failed (attempt $attempt of 3), retrying in 15s"
            sleep 15
          done
          exit 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips42

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: getcourt
          POSTGRES_PASSWORD: getcourt
          POSTGRES_DB: getcourt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U getcourt -d getcourt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev libvips42 pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Check that every autoloaded file eager loads
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: getcourt
          DATABASE_PASSWORD: getcourt
          DATABASE_TEST_NAME: getcourt_test
          DATABASE_TEST_CACHE_NAME: getcourt_test_cache
          DATABASE_TEST_QUEUE_NAME: getcourt_test_queue
          DATABASE_TEST_CABLE_NAME: getcourt_test_cable
        run: bin/rails zeitwerk:check

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: getcourt
          DATABASE_PASSWORD: getcourt
          DATABASE_TEST_NAME: getcourt_test
          DATABASE_TEST_CACHE_NAME: getcourt_test_cache
          DATABASE_TEST_QUEUE_NAME: getcourt_test_queue
          DATABASE_TEST_CABLE_NAME: getcourt_test_cable
        run: bin/rails db:test:prepare test test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      - name: Extract coverage percentage
        if: success() && github.ref == 'refs/heads/main'
        id: coverage
        run: |
          COVERAGE=$(grep -oP '[\d.]+(?=%)' coverage/summary.txt | head -1)
          echo "percent=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Extract Ruby version
        if: success() && github.ref == 'refs/heads/main'
        id: ruby
        run: |
          RUBY_VER=$(cat .ruby-version | sed 's/ruby-//')
          echo "version=$RUBY_VER" >> "$GITHUB_OUTPUT"

      - name: Extract Rails version
        if: success() && github.ref == 'refs/heads/main'
        id: rails
        run: |
          RAILS_VER=$(grep -A1 '^\s*rails ' Gemfile.lock | grep -oP '[\d.]+' | head -1)
          echo "version=$RAILS_VER" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        if: success() && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: "${{ steps.coverage.outputs.percent }}%"
          valColorRange: ${{ steps.coverage.outputs.percent }}
          minColorRange: 0
          maxColorRange: 100

      - name: Update Ruby badge
        if: success() && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: ruby.json
          label: ruby
          message: "${{ steps.ruby.outputs.version }}"
          color: CC342D

      - name: Update Rails badge
        if: success() && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: rails.json
          label: rails
          message: "${{ steps.rails.outputs.version }}"
          color: D30001

  compose_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate development Compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose file
        env:
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          APP_HOST: https://example.com
          DATABASE_USERNAME: getcourt
          DATABASE_PASSWORD: ci-not-a-real-secret
          DATABASE_NAME: getcourt_production
          DATABASE_CACHE_NAME: getcourt_production_cache
          DATABASE_QUEUE_NAME: getcourt_production_queue
          DATABASE_CABLE_NAME: getcourt_production_cable
          SMTP_PASSWORD: ci-smtp-password
        run: |
          printf '%s\n' \
            "SECRET_KEY_BASE=${SECRET_KEY_BASE}" \
            "APP_HOST=${APP_HOST}" \
            "DATABASE_USERNAME=${DATABASE_USERNAME}" \
            "DATABASE_PASSWORD=${DATABASE_PASSWORD}" \
            "DATABASE_NAME=${DATABASE_NAME}" \
            "DATABASE_CACHE_NAME=${DATABASE_CACHE_NAME}" \
            "DATABASE_QUEUE_NAME=${DATABASE_QUEUE_NAME}" \
            "DATABASE_CABLE_NAME=${DATABASE_CABLE_NAME}" \
            "SMTP_PASSWORD=${SMTP_PASSWORD}" \
            > .env.production.ci
          docker compose -f docker-compose.prod.yml --env-file .env.production.ci config --quiet
          docker compose -f docker-compose.fresh.yml --env-file .env.production.ci config --quiet

  docker_build_amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production runtime image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: getcourt:ci-amd64
          cache-from: type=gha,scope=runtime-amd64
          cache-to: type=gha,mode=max,scope=runtime-amd64

  docker_build_arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production runtime image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          push: false
          tags: getcourt:ci-arm64
          cache-from: type=gha,scope=runtime-arm64
          cache-to: type=gha,mode=max,scope=runtime-arm64
