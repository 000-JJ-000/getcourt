# GetCourt tennis — Nginx vhost for getcourt.zanity.net
# Install path (when authorized): /etc/nginx/sites-available/getcourt.zanity.net
# Enable: sudo ln -sf /etc/nginx/sites-available/getcourt.zanity.net /etc/nginx/sites-enabled/
# Always: sudo nginx -t && sudo systemctl reload nginx
# Do NOT overwrite unrelated sites (e.g. sites-enabled/default) without review.
#
# Upstream: Compose project `tennis` with WEB_PORT=127.0.0.1:3010
# (Compose maps "${WEB_PORT}:3000" — use full "127.0.0.1:3010", not bare "3010".)
#
# REQUIRED once (WebSocket): install deploy/nginx/websocket_upgrade.conf →
#   /etc/nginx/conf.d/websocket_upgrade.conf
#
# Phase A — HTTP only BEFORE certificate files exist (ACME HTTP-01).
#   Do NOT enable the HTTPS server block until certbot has written files under
#   /etc/letsencrypt/live/getcourt.zanity.net/
# Phase B — After certbot: enable HTTPS + redirect (or let certbot --nginx edit).

# ---- Phase A: ACME only (safe before TLS; avoids Rails force_ssl → https loops) ----
server {
    listen 80;
    listen [::]:80;
    server_name getcourt.zanity.net;

    # Let's Encrypt HTTP-01 (must win over other locations)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # Do not proxy the app over plain HTTP while force_ssl is on — browsers would
    # be redirected to HTTPS before certificates exist. Smoke-test Rails via:
    #   curl -fsS http://127.0.0.1:3010/up
    location / {
        default_type text/plain;
        return 503 "TLS not configured yet. Use Certbot, then enable Phase B.\n";
    }
}

