# PostgreSQL with PostGIS on the primary database.
# Solid Cache / Queue / Cable each use their own logical database on the same server.
#
# Credentials and hosts come from the environment (see .env-example).

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "getcourt") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "getcourt") %>

development:
  primary:
    <<: *default
    adapter: postgis
    database: <%= ENV.fetch("DATABASE_NAME", "getcourt_development") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_CACHE_NAME", "getcourt_development_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_QUEUE_NAME", "getcourt_development_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_CABLE_NAME", "getcourt_development_cable") %>
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    adapter: postgis
    database: <%= ENV.fetch("DATABASE_TEST_NAME", "getcourt_test") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_TEST_CACHE_NAME", "getcourt_test_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_TEST_QUEUE_NAME", "getcourt_test_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_TEST_CABLE_NAME", "getcourt_test_cable") %>
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    adapter: postgis
    # Include the 3 job threads configured in queue.yml when sharing Puma.
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 3 %>
    database: <%= ENV.fetch("DATABASE_NAME", "getcourt_production") %>
  cache:
    <<: *default
    # Web requests and job threads share this pool in async mode.
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 3 %>
    database: <%= ENV.fetch("DATABASE_CACHE_NAME", "getcourt_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    # Include job threads and headroom for polling, scheduling and heartbeats.
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 7 %>
    database: <%= ENV.fetch("DATABASE_QUEUE_NAME", "getcourt_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_CABLE_NAME", "getcourt_production_cable") %>
    migrations_paths: db/cable_migrate
